name: SNODAS backfill

# Run by hand (Actions tab -> SNODAS backfill -> Run workflow) to fill in the SNODAS history
# for the Vermont points. Each run works for up to ~5.5 hours and picks up where the last stopped.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_snodas.py --max-minutes 330
      - name: Commit SNODAS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/data/snodas
          git commit -m "SNODAS backfill" || echo "No changes"
          git pull --rebase
          git push
