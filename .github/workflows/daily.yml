name: Daily SWE figures

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 7:00 AM Arizona
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/make_figures.py
      - name: Commit updated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/figures docs/data
          git commit -m "Daily figure update" || echo "No changes"
          git push
