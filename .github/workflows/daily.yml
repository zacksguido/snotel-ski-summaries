name: Daily SWE figures

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 7:00 AM Arizona
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

# Never run at the same time as the SNODAS backfill (both commit data files)
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # stop a stuck run instead of waiting hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update SNODAS points (Vermont)
        run: python scripts/update_snodas.py --max-minutes 8
        continue-on-error: true
      - run: python scripts/make_figures.py
      - name: Snowfall forecast (ECMWF via Open-Meteo)
        run: python scripts/update_forecast.py
        continue-on-error: true
      - name: Commit updated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/figures docs/data
          git commit -m "Daily figure update" || echo "No changes"
          git pull --rebase
          git push
